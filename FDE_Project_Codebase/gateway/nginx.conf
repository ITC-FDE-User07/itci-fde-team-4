# S2 Activity 1: NGINX in front of the monolith (Vastra's one new door).
# /legacy/*  -> the 2014 monolith, unchanged (port 8000)
# /v1/*      -> new services (port 8200)
# Every request gets an X-Request-ID and is written to the access log.
# NGINX and the application services run in the same Docker Compose network.

log_format vastra '$remote_addr [$time_local] "$request" $status $request_time rid=$request_id upstream=$upstream_addr';

upstream legacy_monolith { server legacy:8000; }
upstream new_services    { server modern-api:8200; }

server {
    listen 8080;
    access_log /var/log/nginx/vastra_access.log vastra;

    location = / { return 302 /ui/; }

    location /legacy/ {
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://legacy_monolith/;          # trailing slash strips /legacy
    }

    location /v1/ {
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_pass http://new_services/v1/;
    }

    location /ui/ {
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://new_services/ui/;
    }

    location = /docs {
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://new_services/docs;
    }

    location = /openapi.json {
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_pass http://new_services/openapi.json;
    }

    location = /health { return 200 "gateway ok\n"; }
}