# S2 Activity 1: NGINX in front of the monolith (Vastra's one new door).
# /legacy/*  -> the 2014 monolith, unchanged (port 8000)
# /v1/*      -> new services (port 8200)
# Every request gets an X-Request-ID and is written to the access log.
# Use 127.0.0.1 when NGINX runs on your machine; use host.docker.internal when it runs in Docker.

log_format vastra '$remote_addr [$time_local] "$request" $status $request_time rid=$request_id upstream=$upstream_addr';

upstream legacy_monolith { server host.docker.internal:8000; }
upstream new_services    { server host.docker.internal:8200; }

server {
    listen 8080;
    access_log /var/log/nginx/vastra_access.log vastra;

    location /legacy/ {
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://legacy_monolith/;          # trailing slash strips /legacy
    }

    location /v1/ {
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 5s;                       # the gateway never waits forever
        proxy_pass http://new_services/v1/;
    }

    location = /health { return 200 "gateway ok\n"; }
}