[project]
name = "vastra-data"
version = "0.1.0"
description = "Vastra Week 2 data platform: load job, contracts, raw/clean/ready, DPDP tables, fitness scorecard"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<4", "pydantic>=2.7,<3", "PyYAML>=6.0", "httpx>=0.27", "matplotlib>=3.8",
                "python-dotenv>=1.0"]

[tool.setuptools]
packages = ["vastra_data"]
